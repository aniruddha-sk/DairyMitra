{% extends "base.html" %}

{% block title %}{{ _('Add Staff') }}{% endblock %}

{% block content %}

<h2 class="page-title"><i data-lucide="user"></i>‍<i data-lucide="settings"></i> {{ _('Staff Add करा') }}</h2>

<div class="section">

<form method="POST" class="max-w-lg">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div class="mb-4">
<label class="form-label">{{ _('Staff Name') }}</label>
<input type="text" name="name" required class="form-input">
</div>

<div class="mb-4">
<label class="form-label">{{ _('Email (Login ID)') }}</label>
<input type="email" name="email" required class="form-input">
</div>

<div class="mb-4">
<label class="form-label">{{ _('Password') }}</label>
<input type="password" name="password" required class="form-input">
</div>

<div class="mb-6">
<label class="form-label">{{ _('Vehicle Number') }}</label>
<input type="text" name="vehicle" class="form-input" placeholder="{{ _('MH12AB1234') }}">
</div>

<div class="action-bar">

<button type="submit" class="btn btn-primary">
<i class="fa fa-user-plus"></i> {{ _('Add Staff') }}
</button>

<a href="{{ url_for('staff_list') }}" class="btn btn-secondary">
<i class="fa fa-arrow-left"></i> {{ _('Back') }}
</a>

</div>

</form>

</div>

{% endblock %}
