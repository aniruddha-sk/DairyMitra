{% extends "base.html" %}

{% block title %}{{ _('Reset Password') }}{% endblock %}

{% block content %}

<h2 class="page-title"><i data-lucide="key-round"></i> {{ _('Reset Staff Password') }}</h2>

<div class="section">

<form method="POST" class="max-w-lg">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div class="mb-4">
<label class="form-label">{{ _('New Password') }}</label>
<input type="password" name="password" required class="form-input">
</div>

<div class="mb-4">
<label class="form-label">{{ _('Confirm Password') }}</label>
<input type="password" name="confirm_password" required class="form-input">
</div>

<div class="action-bar">

<button type="submit" class="btn btn-primary">
<i class="fa fa-key"></i> {{ _('Reset Password') }}
</button>

<a href="{{ url_for('staff_list') }}" class="btn btn-secondary">
<i class="fa fa-arrow-left"></i> {{ _('Back') }}
</a>

</div>

</form>

</div>

{% endblock %}
