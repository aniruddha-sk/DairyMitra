<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <title>Customer Login - Dairy Mitr</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <link href="{{ url_for('static', filename='css/auth.css') }}" rel="stylesheet">
</head>

<body class="auth-body">

<div class="auth-card">

    <img src="{{ url_for('static', filename='images/Logo-img.png') }}" class="auth-logo">

    <h4 class="auth-title">ग्राहक लॉगिन</h4>

    <p class="auth-subtitle">
        Dairy ID आणि मोबाईल नंबर वापरून लॉगिन करा
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <!-- Dairy ID -->
        <div class="form-floating">
            <input
                type="text"
                class="form-control"
                id="dairy_id"
                name="dairy_id"
                placeholder="DM000001"
                required>

            <label for="dairy_id">
                <i class="fa-solid fa-building"></i>
                Dairy ID
            </label>
        </div>

        <!-- Mobile Number -->
        <div class="form-floating">
            <input
                type="tel"
                class="form-control"
                id="phone"
                name="phone"
                placeholder="9876543210"
                maxlength="10"
                pattern="[0-9]{10}"
                required>

            <label for="phone">
                <i class="fa-solid fa-phone"></i>
                मोबाईल नंबर
            </label>
        </div>

        <button type="submit" class="btn btn-success w-100">
            <i class="fa-solid fa-right-to-bracket"></i>
            लॉगिन
        </button>

    </form>

    <div class="auth-links">

        <a href="{{ url_for('login') }}">
            <i class="fa-solid fa-arrow-left"></i>
            Owner Login
        </a>

    </div>

</div>

</body>
</html>
