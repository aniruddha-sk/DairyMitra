<div class="dp-header">
  <div class="dp-header__left">
    <button id="sidebar-toggle" class="dp-menu-btn" type="button" aria-label="{{ _('Open menu') }}"><i data-lucide="menu"></i></button>
    <a href="{{ url_for('customer_dashboard') }}" class="dp-header__brand header-logo-link" aria-label="{{ BRAND_NAME }}">
      <img src="{{ url_for('static', filename=BRAND_LOGO) }}" alt="{{ BRAND_NAME }} - {{ BRAND_TAGLINE }}" class="header-logo" width="150" height="38">
    </a>
  </div>
  <div class="dp-header__right">
    <span id="dp-net-status" class="dp-net" role="status"><span data-net-label>{{ _('Online') }}</span></span>
    <a href="{{ url_for('customer_notifications') }}" class="dp-menu-btn" style="position:relative" aria-label="{{ _('Notifications') }}" title="{{ _('Notifications') }}">
      <i data-lucide="bell"></i>
      {% if unread_count %}
      <span class="dp-net__count is-alert" style="position:absolute;top:-6px;right:-6px">{{ unread_count }}</span>
      {% endif %}
    </a>
    <form method="post" action="{{ url_for('set_language') }}" class="dp-lang" data-no-loader>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <i data-lucide="languages" class="dp-lang__icon"></i>
      <select name="lang" aria-label="{{ _('Language') }}"
              onchange="if (navigator.onLine === false) { DP.toast(t('This action requires internet.'), 'offline'); this.value = '{{ lang }}'; return; } this.form.submit()">
        {% for code in SUPPORTED_LANGUAGES %}
        <option value="{{ code }}" {{ 'selected' if code == lang }}>{{ LANGUAGE_NAMES[code] }}</option>
        {% endfor %}
      </select>
      <i data-lucide="chevron-down" class="dp-lang__chev"></i>
    </form>
  </div>
</div>
