{% extends "base.html" %}

{% block content %}

<!-- ==========================================================
     ADD VENDOR SPECIAL RATE
     ========================================================== -->

<div class="section">

    <h2 class="page-title">Vendor Special Milk Rate</h2>

    <form method="POST" class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <!-- Vendor -->
        <div>
            <label class="form-label">Vendor</label>

            <select name="vendor_id"
                    class="form-select"
                    required>

                {% for v in vendors %}

                <option value="{{ v.vendor_id }}">
                    {{ v.vendor_id }} - {{ v.name }}
                </option>

                {% endfor %}

            </select>
        </div>


        <!-- Cow Rate -->
        <div>
            <label class="form-label">Cow Rate</label>

            <input
                type="number"
                step="0.01"
                name="cow_rate"
                class="form-input"
                placeholder="Enter cow rate">
        </div>


        <!-- Buffalo Rate -->
        <div>
            <label class="form-label">Buffalo Rate</label>

            <input
                type="number"
                step="0.01"
                name="buffalo_rate"
                class="form-input"
                placeholder="Enter buffalo rate">
        </div>


        <!-- Effective Date -->
        <div>
            <label class="form-label">Effective Date</label>

            <input
                type="date"
                name="date"
                class="form-input"
                required>
        </div>


        <!-- Save Button -->
        <div>
            <button
                type="submit"
                class="btn btn-primary w-full">

                Save

            </button>
        </div>

    </form>

</div>


<!-- ==========================================================
     VENDOR SPECIAL RATES LIST
     ========================================================== -->

<div class="section">

    <div class="table-wrap">

        <table class="table">

            <thead>

                <tr>
                    <th>Vendor</th>
                    <th>Cow Rate</th>
                    <th>Buffalo Rate</th>
                    <th>Date From</th>
                    <th>Action</th>
                </tr>

            </thead>


            <tbody>

                {% for r in rates %}

                <tr>

                    <!-- Vendor -->
                    <td>
                        {{ r.name }}
                    </td>


                    <!-- Cow Rate -->
                    <td>
                        {{ r.cow_rate }}
                    </td>


                    <!-- Buffalo Rate -->
                    <td>
                        {{ r.buffalo_rate }}
                    </td>


                    <!-- Date -->
                    <td>
                        {{ r.date_from }}
                    </td>


                    <!-- Delete -->
                    <td>

                        <form
                            method="POST"
                            action="{{ url_for('vendor_rate') }}"
                            onsubmit="return confirm('हा vendor special rate delete करायचा आहे का?');">

                            <input
                                type="hidden"
                                name="action"
                                value="delete">

                            <input
                                type="hidden"
                                name="rate_id"
                                value="{{ r.id }}">

                            <button
                                type="submit"
                                class="btn btn-danger">

                                Delete

                            </button>

                        </form>

                    </td>

                </tr>

                {% else %}

                <tr>

                    <td colspan="5" style="text-align:center;">
                        No vendor special rates found.
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
