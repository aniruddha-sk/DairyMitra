<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0">

    <title>Reset Password - Dairy Mitr</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         AUTH CSS
    ====================================================== -->

    <link
        href="{{ url_for('static', filename='css/auth.css') }}"
        rel="stylesheet"
    >

</head>


<body class="auth-body">


<!-- =========================================================
     RESET PASSWORD CARD
========================================================= -->

<div class="auth-card">


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <img
        src="{{ url_for('static', filename='images/Logo-img.png') }}"
        alt="Dairy Mitr"
        class="auth-logo"
    >


    <!-- =====================================================
         SECURITY ICON
    ====================================================== -->

    <div class="reset-icon">

        <i class="fa-solid fa-shield-halved"></i>

    </div>


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <h1 class="auth-title">

        नवीन पासवर्ड

    </h1>


    <!-- =====================================================
         SUBTITLE
    ====================================================== -->

    <p class="auth-subtitle">

        तुमचा नवीन सुरक्षित पासवर्ड तयार करा.

    </p>


    <!-- =====================================================
         FLASH MESSAGES
    ====================================================== -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div
                    class="alert alert-{{ category }}"
                    role="alert"
                >

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- =====================================================
         RESET FORM
    ====================================================== -->

    <form
        method="POST"
        action="{{ url_for('reset_password') }}"
        id="resetPasswordForm"
    >


        <!-- =================================================
             NEW PASSWORD
        ================================================== -->

        <div class="form-floating position-relative">

            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Password"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <label for="password">

                <i class="fa-solid fa-lock"></i>

                नवीन पासवर्ड

            </label>


            <!-- SHOW PASSWORD -->

            <i
                class="fa-solid fa-eye toggle-password"
                onclick="togglePassword('password', this)"
                title="Show Password"
            ></i>

        </div>


        <!-- =================================================
             PASSWORD STRENGTH
        ================================================== -->

        <div class="password-strength">

            <div class="strength-bar">

                <span id="strengthProgress"></span>

            </div>

            <small id="strengthText">
                Password strength
            </small>

        </div>


        <!-- =================================================
             CONFIRM PASSWORD
        ================================================== -->

        <div class="form-floating position-relative">

            <input
                type="password"
                class="form-control"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm Password"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">

                <i class="fa-solid fa-lock"></i>

                पासवर्ड पुन्हा लिहा

            </label>


            <!-- SHOW PASSWORD -->

            <i
                class="fa-solid fa-eye toggle-password"
                onclick="togglePassword(
                    'confirm_password',
                    this
                )"
                title="Show Password"
            ></i>

        </div>


        <!-- =================================================
             PASSWORD MATCH
        ================================================== -->

        <div
            id="passwordMatch"
            class="password-match"
        ></div>


        <!-- =================================================
             RESET BUTTON
        ================================================== -->

        <button
            type="submit"
            class="btn btn-primary w-100"
            id="resetButton"
        >

            <i class="fa-solid fa-key"></i>

            Reset Password

        </button>


    </form>


    <!-- =====================================================
         BACK LOGIN
    ====================================================== -->

    <div class="auth-links">

        <a href="{{ url_for('login') }}">

            <i class="fa-solid fa-arrow-left"></i>

            परत लॉगिन करा

        </a>

    </div>


</div>



<!-- =========================================================
     PAGE SPECIFIC CSS
========================================================= -->

<style>


/* =========================================================
   RESET ICON
========================================================= */

.reset-icon {

    width: 70px;

    height: 70px;

    margin:
        0 auto 18px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    color: #2563eb;

    font-size: 25px;

    background:
        linear-gradient(
            145deg,
            #eff6ff,
            #dbeafe
        );

    border:
        1px solid #bfdbfe;

    box-shadow:
        0 10px 25px
        rgba(37,99,235,.12);

    animation:
        resetIconAnimation
        3s
        ease-in-out
        infinite;
}


/* =========================================================
   ICON ANIMATION
========================================================= */

@keyframes resetIconAnimation {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(0deg);

    }

    50% {

        transform:
            translateY(-7px)
            rotate(-4deg);

    }

}


/* =========================================================
   PASSWORD STRENGTH
========================================================= */

.password-strength {

    width: 100%;

    margin-top: -7px;

    margin-bottom: 15px;

}


/* =========================================================
   STRENGTH BAR
========================================================= */

.strength-bar {

    width: 100%;

    height: 5px;

    background:
        #e2e8f0;

    border-radius: 20px;

    overflow: hidden;

}


/* =========================================================
   PROGRESS
========================================================= */

#strengthProgress {

    display: block;

    width: 0%;

    height: 100%;

    border-radius: 20px;

    background:
        #ef4444;

    transition:
        width .35s ease,
        background .35s ease;

}


/* =========================================================
   STRENGTH TEXT
========================================================= */

#strengthText {

    display: block;

    margin-top: 6px;

    font-size: 10px;

    color:
        #94a3b8;

    transition:
        color .25s ease;

}


/* =========================================================
   PASSWORD MATCH
========================================================= */

.password-match {

    min-height: 18px;

    margin-top: -8px;

    margin-bottom: 10px;

    font-size: 11px;

    font-weight: 600;

    text-align: left;

}


/* MATCH */

.password-match.match {

    color:
        #16a34a;

}


/* NOT MATCH */

.password-match.no-match {

    color:
        #dc2626;

}


/* =========================================================
   BUTTON ICON
========================================================= */

#resetButton i {

    transition:
        transform .3s ease;

}


#resetButton:hover i {

    transform:
        rotate(-10deg)
        scale(1.08);

}


/* =========================================================
   PASSWORD TOGGLE
========================================================= */

.toggle-password {

    position:
        absolute;

    right:
        15px;

    top:
        50%;

    transform:
        translateY(-50%);

    z-index:
        10;

    cursor:
        pointer;

    color:
        #94a3b8;

    transition:
        color .2s ease,
        transform .2s ease;

}


.toggle-password:hover {

    color:
        #2563eb;

    transform:
        translateY(-50%)
        scale(1.1);

}


</style>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>


/* =========================================================
   PASSWORD SHOW / HIDE
========================================================= */

function togglePassword(fieldId, icon) {

    const field =
        document.getElementById(fieldId);


    if (field.type === "password") {

        field.type = "text";

        icon.classList.remove(
            "fa-eye"
        );

        icon.classList.add(
            "fa-eye-slash"
        );

        icon.setAttribute(
            "title",
            "Hide Password"
        );

    }

    else {

        field.type = "password";

        icon.classList.remove(
            "fa-eye-slash"
        );

        icon.classList.add(
            "fa-eye"
        );

        icon.setAttribute(
            "title",
            "Show Password"
        );

    }

}



/* =========================================================
   PASSWORD ELEMENTS
========================================================= */

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById(
        "confirm_password"
    );

const strengthProgress =
    document.getElementById(
        "strengthProgress"
    );

const strengthText =
    document.getElementById(
        "strengthText"
    );

const passwordMatch =
    document.getElementById(
        "passwordMatch"
    );



/* =========================================================
   PASSWORD STRENGTH
========================================================= */

password.addEventListener(
    "input",
    function () {

        const value =
            password.value;

        let strength = 0;


        /* Length */

        if (value.length >= 6) {

            strength++;

        }


        /* Uppercase */

        if (/[A-Z]/.test(value)) {

            strength++;

        }


        /* Number */

        if (/[0-9]/.test(value)) {

            strength++;

        }


        /* Special Character */

        if (
            /[^A-Za-z0-9]/.test(value)
        ) {

            strength++;

        }


        /* =================================================
           UPDATE UI
        ================================================== */

        if (value.length === 0) {

            strengthProgress.style.width =
                "0%";

            strengthText.textContent =
                "Password strength";

            strengthText.style.color =
                "#94a3b8";

        }

        else if (strength === 1) {

            strengthProgress.style.width =
                "25%";

            strengthProgress.style.background =
                "#ef4444";

            strengthText.textContent =
                "Weak password";

            strengthText.style.color =
                "#ef4444";

        }

        else if (strength === 2) {

            strengthProgress.style.width =
                "50%";

            strengthProgress.style.background =
                "#f59e0b";

            strengthText.textContent =
                "Medium password";

            strengthText.style.color =
                "#f59e0b";

        }

        else if (strength === 3) {

            strengthProgress.style.width =
                "75%";

            strengthProgress.style.background =
                "#3b82f6";

            strengthText.textContent =
                "Good password";

            strengthText.style.color =
                "#3b82f6";

        }

        else {

            strengthProgress.style.width =
                "100%";

            strengthProgress.style.background =
                "#16a34a";

            strengthText.textContent =
                "Strong password";

            strengthText.style.color =
                "#16a34a";

        }


        checkPasswordMatch();

    }
);



/* =========================================================
   PASSWORD MATCH CHECK
========================================================= */

confirmPassword.addEventListener(
    "input",
    checkPasswordMatch
);


function checkPasswordMatch() {

    const pass =
        password.value;

    const confirm =
        confirmPassword.value;


    if (!confirm) {

        passwordMatch.textContent =
            "";

        passwordMatch.className =
            "password-match";

        return;

    }


    if (pass === confirm) {

        passwordMatch.textContent =
            "✓ Passwords match";

        passwordMatch.className =
            "password-match match";

    }

    else {

        passwordMatch.textContent =
            "✕ Passwords do not match";

        passwordMatch.className =
            "password-match no-match";

    }

}



/* =========================================================
   FORM VALIDATION
========================================================= */

const resetForm =
    document.getElementById(
        "resetPasswordForm"
    );


resetForm.addEventListener(
    "submit",
    function (event) {

        const pass =
            password.value;

        const confirm =
            confirmPassword.value;


        if (pass !== confirm) {

            event.preventDefault();

            passwordMatch.textContent =
                "✕ Passwords do not match";

            passwordMatch.className =
                "password-match no-match";

            confirmPassword.focus();

            return;

        }


        if (pass.length < 6) {

            event.preventDefault();

            strengthText.textContent =
                "Password must contain at least 6 characters";

            strengthText.style.color =
                "#dc2626";

            password.focus();

            return;

        }


        /* Loading state */

        const button =
            document.getElementById(
                "resetButton"
            );


        button.classList.add(
            "loading"
        );

        button.disabled = true;

    }
);


</script>


</body>

</html>
