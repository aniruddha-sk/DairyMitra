<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <title>Signup - Dairy Mitr</title>

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         AUTH CSS
    ====================================================== -->

    <link
        href="{{ url_for('static', filename='css/auth.css') }}"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           SIGNUP CARD
        ===================================================== */

        .signup-card {

            position: relative;

            overflow: hidden;

        }


        /* =====================================================
           DECORATIVE GLOW
        ===================================================== */

        .signup-card::before {

            content: "";

            position: absolute;

            width: 190px;

            height: 190px;

            top: -105px;

            right: -85px;

            border-radius: 50%;

            background:
                rgba(37, 99, 235, .08);

            pointer-events: none;

        }


        .signup-card::after {

            content: "";

            position: absolute;

            width: 140px;

            height: 140px;

            bottom: -90px;

            left: -80px;

            border-radius: 50%;

            background:
                rgba(59, 130, 246, .06);

            pointer-events: none;

        }


        /* =====================================================
           LOGO
        ====================================================== */

        .signup-logo {

            width: 72px;

            height: 72px;

            object-fit: contain;

            display: block;

            margin:
                0 auto 15px;

            border-radius: 18px;

            animation:
                signupLogoFloat
                3s
                ease-in-out
                infinite;

        }


        @keyframes signupLogoFloat {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(0deg);

            }

            50% {

                transform:
                    translateY(-6px)
                    rotate(1deg);

            }

        }


        /* =====================================================
           ICON
        ====================================================== */

        .signup-icon {

            width: 68px;

            height: 68px;

            margin:
                0 auto 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #eff6ff,
                    #dbeafe
                );

            border:
                1px solid
                #bfdbfe;

            color:
                #2563eb;

            font-size:
                25px;

            box-shadow:
                0 10px 28px
                rgba(37, 99, 235, .14);

            animation:
                signupIconPulse
                3s
                ease-in-out
                infinite;

        }


        @keyframes signupIconPulse {

            0%,
            100% {

                transform:
                    scale(1);

            }

            50% {

                transform:
                    scale(1.05);

            }

        }


        /* =====================================================
           TITLE
        ====================================================== */

        .signup-title {

            font-size:
                29px !important;

            margin-bottom:
                7px;

        }


        /* =====================================================
           SUBTITLE
        ====================================================== */

        .signup-subtitle {

            margin-bottom:
                22px;

        }


        /* =====================================================
           FORM
        ====================================================== */

        .signup-form {

            position:
                relative;

            z-index:
                2;

        }


        .signup-form .form-floating {

            margin-bottom:
                13px;

        }


        /* =====================================================
           INPUT
        ====================================================== */

        .signup-form .form-control {

            transition:
                all .25s ease;

        }


        .signup-form .form-control:focus {

            transform:
                translateY(-1px);

        }


        /* =====================================================
           PASSWORD ICON
        ====================================================== */

        .toggle-password {

            position:
                absolute;

            right:
                15px;

            top:
                50%;

            transform:
                translateY(-50%);

            cursor:
                pointer;

            color:
                #94a3b8;

            z-index:
                10;

            transition:
                all .25s ease;

        }


        .toggle-password:hover {

            color:
                #2563eb;

            transform:
                translateY(-50%)
                scale(1.12);

        }


        /* =====================================================
           PASSWORD STRENGTH
        ====================================================== */

        .password-strength {

            height:
                4px;

            width:
                100%;

            background:
                #e2e8f0;

            border-radius:
                20px;

            overflow:
                hidden;

            margin:
                -6px 0 12px;

        }


        .password-strength-bar {

            height:
                100%;

            width:
                0%;

            border-radius:
                20px;

            transition:
                all .35s ease;

        }


        .password-strength-text {

            display:
                block;

            text-align:
                right;

            min-height:
                15px;

            margin-top:
                -8px;

            margin-bottom:
                8px;

            font-size:
                10px;

            font-weight:
                700;

        }


        /* =====================================================
           PASSWORD MATCH
        ====================================================== */

        .password-match {

            display:
                block;

            min-height:
                15px;

            margin-top:
                -7px;

            margin-bottom:
                8px;

            font-size:
                10px;

            font-weight:
                700;

        }


        .match-success {

            color:
                #16a34a;

        }


        .match-error {

            color:
                #dc2626;

        }


        /* =====================================================
           CREATE ACCOUNT BUTTON
        ====================================================== */

        .signup-button {

            position:
                relative;

            overflow:
                hidden;

            margin-top:
                4px;

        }


        .signup-button::before {

            content: "";

            position:
                absolute;

            top:
                0;

            left:
                -100%;

            width:
                100%;

            height:
                100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.25),
                    transparent
                );

            transition:
                left .6s ease;

        }


        .signup-button:hover::before {

            left:
                100%;

        }


        .signup-button i {

            transition:
                transform .3s ease;

        }


        .signup-button:hover i {

            transform:
                scale(1.15)
                rotate(-5deg);

        }


        /* =====================================================
           LOGIN LINK
        ====================================================== */

        .signup-login-link {

            margin-top:
                18px;

            font-size:
                13px;

        }


        .signup-login-link a {

            font-weight:
                700;

        }


        /* =====================================================
           TERMS
        ====================================================== */

        .signup-note {

            margin-top:
                15px;

            font-size:
                10px;

            color:
                #94a3b8;

            line-height:
                1.6;

        }


        .signup-note i {

            color:
                #2563eb;

            margin-right:
                3px;

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media(max-width:480px) {

            .signup-logo {

                width:
                    62px;

                height:
                    62px;

            }


            .signup-icon {

                width:
                    60px;

                height:
                    60px;

                font-size:
                    22px;

            }


            .signup-title {

                font-size:
                    25px !important;

            }

        }

    </style>

</head>


<body class="auth-body">


<!-- =========================================================
     SIGNUP CARD
========================================================= -->

<div class="auth-card signup-card">


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <img
        src="{{ url_for('static', filename='images/Logo-img.png') }}"
        class="signup-logo"
        alt="Dairy Mitr Logo"
    >


    <!-- =====================================================
         SIGNUP ICON
    ====================================================== -->

    <div class="signup-icon">

        <i class="fa-solid fa-user-plus"></i>

    </div>


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <h1 class="auth-title signup-title">

        नवीन खाते तयार करा

    </h1>


    <!-- =====================================================
         SUBTITLE
    ====================================================== -->

    <p class="auth-subtitle signup-subtitle">

        Dairy Mitr मध्ये स्वागत आहे

    </p>


    <!-- =====================================================
         FLASH MESSAGES
    ====================================================== -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div
                class="alert alert-{{ category }}"
                role="alert"
            >

                {{ message }}

            </div>

        {% endfor %}

    {% endwith %}


    <!-- =====================================================
         SIGNUP FORM
    ====================================================== -->

    <form
        method="POST"
        class="signup-form"
        id="signupForm"
    >


        <!-- =================================================
             DAIRY NAME
        ================================================== -->

        <div class="form-floating">

            <input
                type="text"
                class="form-control"
                id="dairy_name"
                name="dairy_name"
                placeholder="Dairy Name"
                autocomplete="organization"
                required
            >

            <label for="dairy_name">

                <i class="fa-solid fa-cow"></i>

                डेअरीचं नाव

            </label>

        </div>


        <!-- =================================================
             EMAIL
        ================================================== -->

        <div class="form-floating">

            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <label for="email">

                <i class="fa-solid fa-envelope"></i>

                ई-मेल

            </label>

        </div>


        <!-- =================================================
             PHONE
        ================================================== -->

        <div class="form-floating">

            <input
                type="tel"
                class="form-control"
                id="phone"
                name="phone"
                placeholder="Phone"
                autocomplete="tel"
                maxlength="10"
                inputmode="numeric"
            >

            <label for="phone">

                <i class="fa-solid fa-phone"></i>

                मोबाईल

            </label>

        </div>


        <!-- =================================================
             PASSWORD
        ================================================== -->

        <div class="form-floating position-relative">

            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Password"
                autocomplete="new-password"
                required
            >

            <label for="password">

                <i class="fa-solid fa-lock"></i>

                पासवर्ड

            </label>


            <i
                class="fa-solid fa-eye toggle-password"
                onclick="togglePassword('password', this)"
                title="Show password"
            ></i>

        </div>


        <!-- =================================================
             PASSWORD STRENGTH
        ================================================== -->

        <div class="password-strength">

            <div
                class="password-strength-bar"
                id="strengthBar"
            ></div>

        </div>

        <span
            class="password-strength-text"
            id="strengthText"
        ></span>


        <!-- =================================================
             CONFIRM PASSWORD
        ================================================== -->

        <div class="form-floating position-relative">

            <input
                type="password"
                class="form-control"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm Password"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">

                <i class="fa-solid fa-lock"></i>

                पासवर्ड पुन्हा लिहा

            </label>


            <i
                class="fa-solid fa-eye toggle-password"
                onclick="togglePassword('confirm_password', this)"
                title="Show password"
            ></i>

        </div>


        <!-- =================================================
             PASSWORD MATCH MESSAGE
        ================================================== -->

        <span
            class="password-match"
            id="passwordMatch"
        ></span>


        <!-- =================================================
             SUBMIT
        ================================================== -->

        <button
            type="submit"
            class="btn btn-primary w-100 btn-auth signup-button"
            id="signupButton"
        >

            <i class="fa-solid fa-user-plus"></i>

            खाते तयार करा

        </button>


    </form>


    <!-- =====================================================
         LOGIN LINK
    ====================================================== -->

    <div class="auth-links signup-login-link">

        <a href="{{ url_for('login') }}">

            <i class="fa-solid fa-arrow-left"></i>

            आधीपासून खाते आहे?
            लॉगिन करा

        </a>

    </div>


    <!-- =====================================================
         SECURITY NOTE
    ====================================================== -->

    <div class="signup-note">

        <i class="fa-solid fa-shield-halved"></i>

        तुमची माहिती सुरक्षितपणे वापरली जाईल.

    </div>


</div>



<script>

/* =========================================================
   PASSWORD TOGGLE
========================================================= */

function togglePassword(fieldId, icon) {

    const field =
        document.getElementById(fieldId);


    if (
        field.type === "password"
    ) {

        field.type =
            "text";


        icon.classList.remove(
            "fa-eye"
        );


        icon.classList.add(
            "fa-eye-slash"
        );


        icon.setAttribute(
            "title",
            "Hide password"
        );

    }

    else {

        field.type =
            "password";


        icon.classList.remove(
            "fa-eye-slash"
        );


        icon.classList.add(
            "fa-eye"
        );


        icon.setAttribute(
            "title",
            "Show password"
        );

    }

}


/* =========================================================
   PASSWORD STRENGTH
========================================================= */

const passwordField =
    document.getElementById(
        "password"
    );


const strengthBar =
    document.getElementById(
        "strengthBar"
    );


const strengthText =
    document.getElementById(
        "strengthText"
    );


passwordField.addEventListener(
    "input",
    function() {

        const password =
            this.value;


        let score = 0;


        if (
            password.length >= 6
        ) {

            score++;

        }


        if (
            password.length >= 8
        ) {

            score++;

        }


        if (
            /[A-Z]/.test(password)
        ) {

            score++;

        }


        if (
            /[0-9]/.test(password)
        ) {

            score++;

        }


        if (
            /[^A-Za-z0-9]/.test(password)
        ) {

            score++;

        }


        let width = 0;

        let text = "";


        if (!password) {

            width = 0;

            text = "";

        }

        else if (score <= 2) {

            width = 35;

            text = "Weak";

        }

        else if (score === 3) {

            width = 60;

            text = "Medium";

        }

        else if (score === 4) {

            width = 80;

            text = "Strong";

        }

        else {

            width = 100;

            text = "Very Strong";

        }


        strengthBar.style.width =
            width + "%";


        strengthText.textContent =
            text;


        checkPasswordMatch();

    }
);


/* =========================================================
   PASSWORD MATCH
========================================================= */

const confirmPassword =
    document.getElementById(
        "confirm_password"
    );


const passwordMatch =
    document.getElementById(
        "passwordMatch"
    );


function checkPasswordMatch() {

    const password =
        passwordField.value;


    const confirm =
        confirmPassword.value;


    if (!confirm) {

        passwordMatch.textContent =
            "";

        passwordMatch.className =
            "password-match";

        return;

    }


    if (
        password === confirm
    ) {

        passwordMatch.innerHTML =

            '<i class="fa-solid fa-circle-check"></i> ' +
            'पासवर्ड जुळत आहे';

        passwordMatch.className =
            "password-match match-success";

    }

    else {

        passwordMatch.innerHTML =

            '<i class="fa-solid fa-circle-xmark"></i> ' +
            'पासवर्ड जुळत नाही';

        passwordMatch.className =
            "password-match match-error";

    }

}


confirmPassword.addEventListener(
    "input",
    checkPasswordMatch
);


/* =========================================================
   PHONE NUMBER
========================================================= */

const phoneField =
    document.getElementById(
        "phone"
    );


phoneField.addEventListener(
    "input",
    function() {

        this.value =
            this.value.replace(
                /[^0-9]/g,
                ""
            ).slice(0, 10);

    }
);


/* =========================================================
   FORM SUBMIT
========================================================= */

const signupForm =
    document.getElementById(
        "signupForm"
    );


const signupButton =
    document.getElementById(
        "signupButton"
    );


signupForm.addEventListener(
    "submit",
    function(event) {

        const password =
            passwordField.value;


        const confirm =
            confirmPassword.value;


        /* -----------------------------------------------
           PASSWORD MATCH
        ------------------------------------------------ */

        if (
            password !== confirm
        ) {

            event.preventDefault();


            confirmPassword.focus();


            passwordMatch.innerHTML =

                '<i class="fa-solid fa-circle-xmark"></i> ' +
                'पासवर्ड जुळत नाही';

            passwordMatch.className =
                "password-match match-error";


            return;

        }


        /* -----------------------------------------------
           LOADING STATE
        ------------------------------------------------ */

        signupButton.disabled =
            true;


        signupButton.innerHTML =

            '<i class="fa-solid fa-spinner fa-spin"></i> ' +
            'खाते तयार होत आहे...';

    }
);


/* =========================================================
   AUTO FOCUS
========================================================= */

window.addEventListener(
    "load",
    function() {

        setTimeout(
            function() {

                const dairyName =
                    document.getElementById(
                        "dairy_name"
                    );


                if (dairyName) {

                    dairyName.focus();

                }

            },
            400
        );

    }
);

</script>


</body>

</html>
