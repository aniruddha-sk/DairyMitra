<!DOCTYPE html>
<html lang="{{ lang }}">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0">

    <title>{{ _("Forgot Password") }} | {{ BRAND_NAME }}</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->
    <link href="{{ url_for('static', filename='vendor/bootstrap-5.3.3.min.css') }}" rel="stylesheet">


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->


    <!-- =====================================================
         AUTH CSS
    ====================================================== -->
<link
    href="{{ url_for('static', filename='css/auth.css') }}?v=20260918"
    rel="stylesheet"
>

  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script src="{{ url_for('static', filename='js/csrf.js') }}?v=1"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dairypro.css') }}?v={{ dp_asset_version }}">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#5730bb">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename=BRAND_ICON) }}">
  <script src="/i18n/{{ lang }}.js?v={{ i18n_version }}"></script>
  <script src="{{ url_for('static', filename='js/dp-ui.js') }}?v={{ dp_asset_version }}"></script>
  <script src="{{ url_for('static', filename='js/dp-icons.js') }}?v={{ dp_asset_version }}" data-sprite="{{ url_for('static', filename='icons/dp-icons.svg') }}?v={{ dp_asset_version }}"></script>
</head>


<body class="auth-body">
<form method="post" action="{{ url_for('set_language') }}" class="dp-lang" style="position:fixed;top:12px;right:12px;z-index:50" data-no-loader>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <i data-lucide="languages" class="dp-lang__icon"></i>
  <select name="lang" aria-label="{{ _('Language') }}" onchange="this.form.submit()">
    {% for code in SUPPORTED_LANGUAGES %}<option value="{{ code }}" {{ 'selected' if code == lang }}>{{ LANGUAGE_NAMES[code] }}</option>{% endfor %}
  </select>
  <i data-lucide="chevron-down" class="dp-lang__chev"></i>
</form>
<script>
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/service-worker.js", { scope: "/", updateViaCache: "none" }).catch(function () {}); }
</script>



<!-- =========================================================
     MAIN CARD
========================================================= -->

<div class="auth-card">


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <img
        src="{{ url_for('static', filename=BRAND_ICON) }}"
        alt="{{ BRAND_NAME }}"
        class="auth-logo"
    >


    <!-- =====================================================
         ICON
    ====================================================== -->

    <div class="forgot-icon">

        <i class="fa-solid fa-key"></i>

    </div>


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <h1 class="auth-title">

        {{ _('पासवर्ड विसरलात?') }}

    </h1>


    <!-- =====================================================
         SUBTITLE
    ====================================================== -->

    <p class="auth-subtitle">

        {{ _('तुमचा ई-मेल टाका, आम्ही तुम्हाला OTP पाठवू.') }}

    </p>


    <!-- =====================================================
         FLASH MESSAGES
    ====================================================== -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div
                    class="alert alert-{{ category }}"
                    role="alert"
                >

                    {{ _(message) }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- =====================================================
         FORM
    ====================================================== -->

    <form
        method="POST"
        action="{{ url_for('forgot_password') }}"
    >
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


        <!-- =================================================
             EMAIL
        ================================================== -->

        <div class="form-floating">

            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="{{ _('Email') }}"
                autocomplete="email"
                required
            >

            <label for="email">

                <i class="fa-solid fa-envelope"></i>

                {{ _('ई-मेल') }}

            </label>

        </div>


        <!-- =================================================
             SUBMIT BUTTON
        ================================================== -->

        <button
            type="submit"
            class="btn btn-primary w-100"
        >

            <i class="fa-solid fa-paper-plane"></i>

            {{ _('OTP पाठवा') }}

        </button>


    </form>


    <!-- =====================================================
         BACK TO LOGIN
    ====================================================== -->

    <div class="auth-links">

        <a href="{{ url_for('login') }}">

            <i class="fa-solid fa-arrow-left"></i>

            {{ _('परत लॉगिन करा') }}

        </a>

    </div>


</div>



<!-- =========================================================
     EXTRA ANIMATION CSS
========================================================= -->

<style>

    /* ============================================
       FORGOT PASSWORD ICON
    ============================================ */

    .forgot-icon {

        width: 70px;
        height: 70px;

        margin: 0 auto 18px;

        border-radius: 50%;

        display: flex;

        align-items: center;

        justify-content: center;

        color: #2563eb;

        font-size: 25px;

        background:
            linear-gradient(
                145deg,
                #eff6ff,
                #dbeafe
            );

        border:
            1px solid #bfdbfe;

        box-shadow:
            0 10px 25px
            rgba(37, 99, 235, .12);

        animation:
            forgotIconFloat
            3s
            ease-in-out
            infinite;

    }


    /* ============================================
       ICON ANIMATION
    ============================================ */

    @keyframes forgotIconFloat {

        0%,
        100% {

            transform:
                translateY(0)
                rotate(0deg);

        }

        50% {

            transform:
                translateY(-7px)
                rotate(4deg);

        }

    }


    /* ============================================
       BUTTON ICON
    ============================================ */

    .auth-card .btn i {

        transition:
            transform .3s ease;

    }


    .auth-card .btn:hover i {

        transform:
            translateX(4px);

    }


    /* ============================================
       BACK LINK
    ============================================ */

    .auth-card .auth-links i {

        transition:
            transform .25s ease;

    }


    .auth-card .auth-links a:hover i {

        transform:
            translateX(-4px);

    }


    /* ============================================
       EMAIL FOCUS
    ============================================ */

    #email:focus {

        box-shadow:
            0 0 0 4px
            rgba(37, 99, 235, .10);

    }

</style>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

    /* =====================================================
       FORM LOADING
    ====================================================== */

    const forgotForm =
        document.querySelector(
            'form[action*="forgot_password"]'
        );


    if (forgotForm) {

        forgotForm.addEventListener(
            "submit",
            function () {

                const button =
                    forgotForm.querySelector(
                        "button[type='submit']"
                    );


                if (button) {

                    button.classList.add(
                        "loading"
                    );

                    button.disabled = true;

                }

            }
        );

    }


    /* =====================================================
       AUTO FOCUS EMAIL
    ====================================================== */

    window.addEventListener(
        "load",
        function () {

            const email =
                document.getElementById("email");

            if (email) {

                setTimeout(
                    () => email.focus(),
                    400
                );

            }

        }
    );

</script>


</body>

</html>
