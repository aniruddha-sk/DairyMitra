<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0">

    <title>Forgot Password - Dairy Mitr</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         AUTH CSS
    ====================================================== -->
<link
    href="{{ url_for('static', filename='css/auth.css') }}?v=20260918"
    rel="stylesheet"
>

</head>


<body class="auth-body">


<!-- =========================================================
     MAIN CARD
========================================================= -->

<div class="auth-card">


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <img
        src="{{ url_for('static', filename='images/Logo-img.png') }}"
        alt="Dairy Mitr"
        class="auth-logo"
    >


    <!-- =====================================================
         ICON
    ====================================================== -->

    <div class="forgot-icon">

        <i class="fa-solid fa-key"></i>

    </div>


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <h1 class="auth-title">

        पासवर्ड विसरलात?

    </h1>


    <!-- =====================================================
         SUBTITLE
    ====================================================== -->

    <p class="auth-subtitle">

        तुमचा ई-मेल टाका,
        आम्ही तुम्हाला OTP पाठवू.

    </p>


    <!-- =====================================================
         FLASH MESSAGES
    ====================================================== -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div
                    class="alert alert-{{ category }}"
                    role="alert"
                >

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- =====================================================
         FORM
    ====================================================== -->

    <form
        method="POST"
        action="{{ url_for('forgot_password') }}"
    >


        <!-- =================================================
             EMAIL
        ================================================== -->

        <div class="form-floating">

            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <label for="email">

                <i class="fa-solid fa-envelope"></i>

                ई-मेल

            </label>

        </div>


        <!-- =================================================
             SUBMIT BUTTON
        ================================================== -->

        <button
            type="submit"
            class="btn btn-primary w-100"
        >

            <i class="fa-solid fa-paper-plane"></i>

            OTP पाठवा

        </button>


    </form>


    <!-- =====================================================
         BACK TO LOGIN
    ====================================================== -->

    <div class="auth-links">

        <a href="{{ url_for('login') }}">

            <i class="fa-solid fa-arrow-left"></i>

            परत लॉगिन करा

        </a>

    </div>


</div>



<!-- =========================================================
     EXTRA ANIMATION CSS
========================================================= -->

<style>

    /* ============================================
       FORGOT PASSWORD ICON
    ============================================ */

    .forgot-icon {

        width: 70px;
        height: 70px;

        margin: 0 auto 18px;

        border-radius: 50%;

        display: flex;

        align-items: center;

        justify-content: center;

        color: #2563eb;

        font-size: 25px;

        background:
            linear-gradient(
                145deg,
                #eff6ff,
                #dbeafe
            );

        border:
            1px solid #bfdbfe;

        box-shadow:
            0 10px 25px
            rgba(37, 99, 235, .12);

        animation:
            forgotIconFloat
            3s
            ease-in-out
            infinite;

    }


    /* ============================================
       ICON ANIMATION
    ============================================ */

    @keyframes forgotIconFloat {

        0%,
        100% {

            transform:
                translateY(0)
                rotate(0deg);

        }

        50% {

            transform:
                translateY(-7px)
                rotate(4deg);

        }

    }


    /* ============================================
       BUTTON ICON
    ============================================ */

    .auth-card .btn i {

        transition:
            transform .3s ease;

    }


    .auth-card .btn:hover i {

        transform:
            translateX(4px);

    }


    /* ============================================
       BACK LINK
    ============================================ */

    .auth-card .auth-links i {

        transition:
            transform .25s ease;

    }


    .auth-card .auth-links a:hover i {

        transform:
            translateX(-4px);

    }


    /* ============================================
       EMAIL FOCUS
    ============================================ */

    #email:focus {

        box-shadow:
            0 0 0 4px
            rgba(37, 99, 235, .10);

    }

</style>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

    /* =====================================================
       FORM LOADING
    ====================================================== */

    const forgotForm =
        document.querySelector(
            'form[action*="forgot_password"]'
        );


    if (forgotForm) {

        forgotForm.addEventListener(
            "submit",
            function () {

                const button =
                    forgotForm.querySelector(
                        "button[type='submit']"
                    );


                if (button) {

                    button.classList.add(
                        "loading"
                    );

                    button.disabled = true;

                }

            }
        );

    }


    /* =====================================================
       AUTO FOCUS EMAIL
    ====================================================== */

    window.addEventListener(
        "load",
        function () {

            const email =
                document.getElementById("email");

            if (email) {

                setTimeout(
                    () => email.focus(),
                    400
                );

            }

        }
    );

</script>


</body>

</html>
