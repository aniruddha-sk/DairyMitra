<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Staff Login Verification - DairyMitra</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Your Auth CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}"
    >

</head>

<body class="auth-body">

    <div class="auth-card">

        <!-- LOGO -->
        <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            alt="DairyMitra"
            class="auth-logo"
        >

        <!-- TITLE -->
        <div class="auth-title">
            Staff Login Verification
        </div>

        <!-- SUBTITLE -->
        <div class="auth-subtitle">
            An OTP has been sent to the owner's registered email address.
        </div>


        <!-- FLASH MESSAGES -->
        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div
                        class="alert alert-{{ category }}"
                        role="alert"
                    >
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- OTP FORM -->
        <form
            method="POST"
            action="{{ url_for('verify_staff_otp') }}"
        >

            <!-- OTP -->
            <div class="form-floating">

                <input
                    type="text"
                    class="form-control text-center"
                    id="otp"
                    name="otp"
                    placeholder="Enter OTP"
                    maxlength="6"
                    minlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    required
                >

                <label for="otp">
                    Enter 6-Digit OTP
                </label>

            </div>


            <!-- VERIFY BUTTON -->
            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                Verify OTP
            </button>

        </form>


        <!-- LINKS -->
        <div class="auth-links">

            <a href="{{ url_for('login') }}">
                Back to Login
            </a>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
